name: Build Artalk Upgit Image

on:
  workflow_dispatch:
    inputs:
      upgit_version:
        description: 'Upgit release tag, e.g. v0.3.0'
        required: true
        default: 'v0.3.0'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kmoretti/artalk-upgit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.upgit
          push: true
          build-args: |
            UPGIT_TAG=${{ inputs.upgit_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ inputs.upgit_version }}

      - name: Clean Build Artifacts
        if: always()
        run: rm -rf upgit-download